<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBYEREEMAH Scientific Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef8;--ink:#0b1b3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--ink:#e8eefc}}
:root[data-theme="dark"]{--bg:#0a1226;--ink:#e8eefc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,system-ui,sans-serif;display:flex;justify-content:center}
.calc{width:100%;max-width:440px;min-height:100vh;padding:10px;background:linear-gradient(180deg,var(--b1),var(--b2));color:var(--tx);display:flex;flex-direction:column;gap:8px;position:relative}
.top{display:flex;align-items:center;gap:8px}
.brand{flex:1}.brand h1{margin:0;font:700 30px/1 Teko,Impact,sans-serif;letter-spacing:4px}.brand small{font-size:11px;color:var(--mt)}
.ib{background:none;border:0;color:var(--tx);font-size:22px;padding:4px 8px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.modes button{border:1px solid var(--ln);background:var(--pn);color:var(--mt);border-radius:10px;padding:8px 0;font-weight:700;font-size:13px}
.modes button.on{background:var(--a);color:#fff;border-color:var(--a)}
.screen{background:var(--sc);color:var(--sct);border-radius:18px;padding:12px 16px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between}
.flags{font-size:11px;font-weight:700;color:#a3202c;min-height:14px;letter-spacing:.5px}
.lbl{font-size:11px;font-weight:700;color:#3a5a99}
.inp{font-size:26px;text-align:right;word-break:break-all;min-height:34px;border-bottom:1px solid #e6b8b3;padding-bottom:4px}
.inp::after{content:"";display:inline-block;width:2px;height:26px;background:currentColor;vertical-align:-4px;margin-left:2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.sol{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:28px;font-weight:600;min-height:40px}
.sol.prev{opacity:.5}.sol.err{color:#b3261e;font-size:22px}
.cp{border:0;background:#f3c4be;border-radius:8px;padding:6px 8px;font-size:15px}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.k{position:relative;border:0;border-radius:12px;background:var(--kb,#fff);color:var(--kt,#1a2a4a);font-size:15px;font-weight:600;height:46px;padding-top:9px;box-shadow:0 2px 0 #9fb0cf}
.k:active{transform:translateY(2px);box-shadow:none}
.k .sub{position:absolute;top:3px;left:0;right:0;font-size:9px;font-weight:700;display:flex;justify-content:center;gap:6px}
.sub .s{color:#d28a00}.sub .al{color:#7a3fd0}
.k.shift{background:#f5a623;color:#fff}.k.alpha{background:#8b4fe0;color:#fff}
.k.del{background:#ff9a9a;color:#7a0b0b}.k.ac{background:#ff7676;color:#7a0b0b}
.k.on{outline:3px solid #6fe3ff}
.num{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:2px}
.num .k{height:58px;font-size:22px;padding-top:0}
.num .op{filter:brightness(.94)}
.num .eq{grid-column:5;grid-row:2/5;height:auto;background:var(--a);color:#fff;font-size:30px}
.hist{position:absolute;inset:0;background:var(--b2);padding:14px;overflow:auto;display:none;z-index:5}
.hist.show{display:block}
.hist h2{margin:0 0 10px;font-size:17px}
.hi{padding:10px;border-bottom:1px solid var(--ln);text-align:right}
.hi small{display:block;color:var(--mt)}.hi b{font-size:20px}
.empty{color:var(--mt)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;color:#fff;padding:6px 12px;border-radius:14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.inp::after{animation:none}}

.calc{--b1:#3d0b12;--b2:#1c0509;--tx:#fff;--ln:#7a1c26;--pn:#4a0f17;--mt:#ff9aa5;--a:#e5232f;--sc:#ffe4e1;--sct:#3a0a10}
.calc.lt{--b1:#fff1f1;--b2:#ffd6d6;--tx:#3a0a10;--ln:#f0aaaa;--pn:#ffe3e3;--mt:#b3202c;--sc:#fff}
.fr{display:flex;justify-content:space-between;align-items:center}.wm{font:700 13px Teko,sans-serif;letter-spacing:3px;color:#a3202c}
.panel,.dr{position:absolute;inset:0;z-index:6;display:none}.panel.show,.dr.show{display:block}
.panel{background:linear-gradient(180deg,var(--b1),var(--b2));padding:12px;overflow:auto}
.ph{display:flex;align-items:center;gap:8px;margin-bottom:10px}.ph h2{margin:0;font-size:18px}
.fld{display:block;margin-bottom:10px;font-size:12px;color:var(--mt)}
.fld input,.fld select{display:block;width:100%;margin-top:4px;padding:11px;border-radius:10px;border:1px solid var(--ln);background:#fff;color:#1a1a1a;font-size:16px}
.btns{display:flex;gap:8px;margin:12px 0}.btns button{flex:1;padding:12px;border-radius:24px;border:1px solid var(--a);font-weight:700;font-size:15px;background:transparent;color:var(--tx)}.btns .go{background:var(--a);color:#fff}
.res{background:var(--pn);border-radius:14px;padding:4px 12px}.rw{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln);white-space:pre-wrap;text-align:right}.rw:last-child{border:0}.rw span:first-child{color:var(--mt);text-align:left}.rw.e{color:#ff8a8a}
canvas{width:100%;background:#fff;border-radius:12px;margin-top:10px}
.dr{background:#000a}.dp{width:78%;max-width:340px;height:100%;background:linear-gradient(180deg,var(--b1),var(--b2));overflow:auto;padding:14px}
.dp .dh b{display:block;font:700 30px Teko,sans-serif;letter-spacing:4px}.dp small{color:var(--mt)}
.dp button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:12px 6px;font-size:16px;border-bottom:1px solid var(--ln)}
.dp h3{margin:14px 0 4px;font-size:11px;color:var(--mt);letter-spacing:1px}
.kc{background:var(--pn);border-radius:12px;padding:10px;margin-bottom:8px}.kc b{display:block}.kc small{color:var(--mt);word-break:break-all}.kc .btns{margin:8px 0 0}.kc .btns button{padding:7px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.sw select{padding:7px;border-radius:8px}.sw input{width:22px;height:22px}
.cmp .k{height:38px;padding-top:7px}.cmp .num .k{height:46px;padding-top:0}.lg .inp{font-size:34px}.lg .sol{font-size:36px}.nosec .sub{display:none}
</style>
</head>
<body>
<div class="calc" id="calc">
  <div class="top"><button class="ib" id="menu" aria-label="Menu">&#9776;</button><div class="brand"><h1>IBYEREEMAH</h1><small>Scientific Calculator</small></div><button class="ib" id="hbtn" aria-label="History">&#8634;</button><button class="ib" id="gear" aria-label="Settings">&#9881;</button></div>
  <div class="modes">
    <button id="mAngle">DEG</button><button id="mFmt" class="on">NORM</button>
    <button id="mMath">MATH</button><button id="mDeci" class="on">DECI</button>
  </div>
  <div class="screen">
    <div class="fr"><span class="flags" id="flags"></span><b class="wm">IBYEREEMAH</b></div>
    <div class="inp" id="inp"></div>
    <div class="sol" id="sol"><span id="solv">= 0</span><button class="cp" id="cp" aria-label="Copy">&#128203;</button></div>
  </div>
  <div class="keys" id="keys"></div>
  <div class="num" id="num"></div>
  <div class="hist" id="hist"><button class="ib" id="hclose" style="float:right">&#10005;</button><h2>History</h2><div id="hlist"></div></div>
  <div class="panel" id="panel"><div class="ph"><button class="ib" id="pback">&#8592;</button><h2 id="ptitle"></h2></div><div id="pbody"></div></div>
  <div class="dr" id="dr"><div class="dp"><div class="dh"><b>IBYEREEMAH</b><small>Scientific Calculator</small></div><div id="dlist"></div></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
(function(){
"use strict";
/* ---------- State ---------- */
var S={input:"",ans:0,done:false,shift:false,alpha:false,sto:false,angle:"DEG",fmt:"NORM",math:false,vars:{X:0,Y:0,M:0},hist:[]};
var ANGLES=["DEG","RAD","GRAD"],FMTS=["NORM","SCI","FIX"];

/* ---------- Key layout ---------- */
var ROWS=[
 [{m:"SHIFT",a:"shift",c:"shift"},{m:"ALPHA",a:"alpha",c:"alpha"},{m:"STO",a:"sto"},{m:"RCL",i:"M"},{m:"(",i:"("},{m:")",i:")"}],
 [{m:"x\u207B\u00B9",i:"^(-1)"},{m:"x\u00B2",i:"^2",s:["x\u00B3","^3"]},{m:"x\u02B8",i:"^",s:["\u02B8\u221Ax","^(1/"]},{m:"\u221Ax",i:"\u221A(",s:["\u221Bx","\u221B("]},{m:"x!",i:"!"},{m:"F\u2194D",a:"fd"}],
 [{m:"log",i:"log(",s:["10\u02E3","10^("]},{m:"ln",i:"ln(",s:["e\u02E3","e^("]},{m:"sin",i:"sin(",s:["sin\u207B\u00B9","sin\u207B\u00B9("],al:["X","X"]},{m:"cos",i:"cos(",s:["cos\u207B\u00B9","cos\u207B\u00B9("],al:["Y","Y"]},{m:"tan",i:"tan(",s:["tan\u207B\u00B9","tan\u207B\u00B9("],al:["M","M"]},{m:"Abs",i:"abs("}],
 [{m:"\u03C0",i:"\u03C0"},{m:"e",i:"e"},{m:"nPr",i:"P"},{m:"nCr",i:"C"},{m:"GCD",i:"gcd("},{m:",",i:","}],
 [{m:"Rand",i:"rand"},{m:"Int",i:"int("},{m:"%",i:"%"},{m:"(\u2212)",i:"\u2212"},{m:"DEL",a:"del",c:"del"},{m:"AC",a:"ac",c:"ac"}]
];
var NUM=[
 ["7","8","9",{m:"\u00F7",i:"\u00F7",c:"op"},{m:"\u00D7",i:"\u00D7",c:"op"}],
 ["4","5","6",{m:"\u2212",i:"\u2212",c:"op"},{m:"=",a:"eq",c:"eq"}],
 ["1","2","3",{m:"+",i:"+",c:"op"}],
 ["0",".",{m:"Exp",i:"E"},{m:"Ans",i:"Ans"}]
];

/* ---------- Math helpers ---------- */
function fact(n){if(n<0||n!==Math.floor(n)||n>170)throw 0;var r=1;for(var i=2;i<=n;i++)r*=i;return r}
function nPr(n,r){if(r>n||r<0||n!==Math.floor(n)||r!==Math.floor(r))throw 0;return fact(n)/fact(n-r)}
function nCr(n,r){return nPr(n,r)/fact(r)}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=b;b=a%b;a=t}return a}
function toR(x){return S.angle==="DEG"?x*Math.PI/180:S.angle==="GRAD"?x*Math.PI/200:x}
function fromR(x){return S.angle==="DEG"?x*180/Math.PI:S.angle==="GRAD"?x*200/Math.PI:x}
function tidy(v){return Math.abs(v)<1e-12?0:v}
function call(f,a){var x=a[0];switch(f){
 case"sin":return tidy(Math.sin(toR(x)));
 case"cos":return tidy(Math.cos(toR(x)));
 case"tan":var t=Math.tan(toR(x));if(Math.abs(t)>1e14)throw 0;return tidy(t);
 case"asin":return fromR(Math.asin(x));
 case"acos":return fromR(Math.acos(x));
 case"atan":return fromR(Math.atan(x));
 case"log":return Math.log10(x);
 case"ln":return Math.log(x);
 case"sqrt":return Math.sqrt(x);
 case"cbrt":return Math.cbrt(x);
 case"abs":return Math.abs(x);
 case"int":return Math.floor(x);
 case"gcd":return gcd(x,a[1]);
 }throw 0}

/* ---------- Tokenizer + parser (no eval) ---------- */
var NAMES=/^(sin\u207B\u00B9|cos\u207B\u00B9|tan\u207B\u00B9|sin|cos|tan|log|ln|abs|int|gcd|rand|Ans|e|P|C|X|Y|M)/;
var FMAP={"sin\u207B\u00B9":"asin","cos\u207B\u00B9":"acos","tan\u207B\u00B9":"atan"};
var OPS={"+":"+","-":"-","\u2212":"-","*":"*","\u00D7":"*","/":"/","\u00F7":"/","^":"^","!":"!","%":"%","(":"(",")":")",",":","};
function tokenize(s){var out=[],m;while(s.length){
 if(/^\s/.test(s)){s=s.slice(1);continue}
 if(m=s.match(/^(\d+\.?\d*|\.\d+)(E[+-]?\d+)?/)){out.push({t:"n",v:parseFloat(m[0])});s=s.slice(m[0].length);continue}
 var c=s[0];
 if(c==="\u03C0"){out.push({t:"n",v:Math.PI});s=s.slice(1);continue}
 if(c==="\u221A"){out.push({t:"f",v:"sqrt"});s=s.slice(1);continue}
 if(c==="\u221B"){out.push({t:"f",v:"cbrt"});s=s.slice(1);continue}
 if(m=s.match(NAMES)){var w=m[0];s=s.slice(w.length);
  if(w==="e")out.push({t:"n",v:Math.E});
  else if(w==="Ans")out.push({t:"n",v:S.ans});
  else if(w==="rand")out.push({t:"n",v:Math.round(Math.random()*1000)/1000});
  else if(w==="P"||w==="C")out.push({t:"o",v:w});
  else if(S.vars.hasOwnProperty(w))out.push({t:"n",v:S.vars[w]});
  else out.push({t:"f",v:FMAP[w]||w});
  continue}
 if(OPS[c]){out.push({t:"o",v:OPS[c]});s=s.slice(1);continue}
 throw 1}
 return out}
function evaluate(str){
 var tk=tokenize(str),p=0;
 function pk(){return tk[p]}
 function isO(v){return pk()&&pk().t==="o"&&pk().v===v}
 function expr(){var v=term();while(isO("+")||isO("-")){var o=tk[p++].v,r=term();v=o==="+"?v+r:v-r}return v}
 function term(){var v=unary();for(;;){
  if(isO("*")){p++;v*=unary()}
  else if(isO("/")){p++;v/=unary()}
  else if(pk()&&(pk().t==="n"||pk().t==="f"||isO("("))){v*=unary()}
  else break}return v}
 function unary(){if(isO("-")){p++;return -unary()}if(isO("+")){p++;return unary()}return perm()}
 function perm(){var v=power();while(isO("P")||isO("C")){var o=tk[p++].v,r=power();v=o==="P"?nPr(v,r):nCr(v,r)}return v}
 function power(){var b=post();if(isO("^")){p++;return Math.pow(b,upow())}return b}
 function upow(){if(isO("-")){p++;return -upow()}if(isO("+")){p++;return upow()}return power()}
 function post(){var v=prim();while(isO("!")||isO("%")){var o=tk[p++].v;v=o==="!"?fact(v):v/100}return v}
 function prim(){var t=tk[p++];if(!t)throw 1;
  if(t.t==="n")return t.v;
  if(t.t==="o"&&t.v==="("){var v=expr();if(isO(")"))p++;return v}
  if(t.t==="f"){if(!isO("("))throw 1;p++;var a=[expr()];while(isO(",")){p++;a.push(expr())}if(isO(")"))p++;return call(t.v,a)}
  throw 1}
 if(!tk.length)throw 1;
 var r=expr();if(p<tk.length)throw 1;
 if(!isFinite(r)||isNaN(r))throw 0;
 return r}

/* ---------- Formatting ---------- */
var CFG={theme:"dark",acc:"Red",bg:"Wine",disp:"Soft pink",keyc:"White",compact:false,large:false,prec:"Auto",thou:false,live:true,sec:true,hint:true};
function fmt(v){v=parseFloat(v.toPrecision(12));if(CFG.prec!=="Auto"&&!S.math&&S.fmt==="NORM"&&Math.abs(v)<1e10)v=+v.toFixed(+CFG.prec);var t=fmt0(v);if(CFG.thou)t=t.replace(/^(-?\d+)/,function(m){return m.replace(/\B(?=(\d{3})+(?!\d))/g,",")});return t}
function frac(v){var s=v<0?"-":"",x=Math.abs(v),h1=1,h0=0,k1=0,k0=1,b=x;
 for(var i=0;i<20;i++){var a=Math.floor(b),h=a*h1+h0,k=a*k1+k0;h0=h1;h1=h;k0=k1;k1=k;
  if(k>10000)return null;
  if(Math.abs(x-h/k)<1e-11*Math.max(1,x))return s+h+"/"+k;
  if(b===a)break;b=1/(b-a)}return null}
function fmt0(v){v=parseFloat(v.toPrecision(12));
 if(S.math&&v!==Math.floor(v)){var f=frac(v);if(f)return f}
 if(S.fmt==="SCI")return v.toExponential(5).replace("e+","E").replace("e","E");
 if(S.fmt==="FIX")return v.toFixed(4);
 var a=Math.abs(v);if(a!==0&&(a>=1e10||a<1e-9))return String(parseFloat(v.toExponential(9))).replace("e+","E").replace("e","E");
 return String(v)}

/* ---------- UI ---------- */
var $=function(i){return document.getElementById(i)};
var elInp=$("inp"),elSol=$("sol"),elSolv=$("solv"),elFlags=$("flags"),toastT;
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove("show")},1400)}
function render(){
 elInp.textContent=S.input;
 var txt="= "+fmt(S.ans),cls="sol";
 if(S.err){txt=S.err;cls+=" err"}
 else if(!S.done&&CFG.live){cls+=" prev";try{txt=S.input?"= "+fmt(evaluate(S.input)):"= 0"}catch(e){txt=S.input?"":"= 0"}}
 elSol.className=cls;elSolv.textContent=txt;
 elFlags.textContent=[S.shift?"S":"",S.alpha?"A":"",S.sto?"STO\u2192":"",S.angle==="DEG"?"D":S.angle==="RAD"?"R":"G"].filter(Boolean).join("  ");
 $("mAngle").textContent=S.angle;$("mFmt").textContent=S.fmt;
 $("mMath").classList.toggle("on",S.math);$("mDeci").classList.toggle("on",!S.math);
 document.querySelector(".k.shift").classList.toggle("on",S.shift);
 document.querySelector(".k.alpha").classList.toggle("on",S.alpha)}
var DELRE=/(sin\u207B\u00B9\(|cos\u207B\u00B9\(|tan\u207B\u00B9\(|sin\(|cos\(|tan\(|log\(|ln\(|\u221A\(|\u221B\(|abs\(|int\(|gcd\(|rand|Ans|[\s\S])$/;
function insert(s){
 if(S.done){S.input=/^[+\u00D7\u00F7^!%PC]|^\^/.test(s)?"Ans"+s:s;S.done=false}else S.input+=s;
 S.err=""}
function equals(){
 if(!S.input)return;
 try{var r=evaluate(S.input);S.hist.unshift({e:S.input,r:r});if(S.hist.length>30)S.hist.pop();S.ans=r;S.done=true;S.err=""}
 catch(e){S.err=e===1?"Syntax ERROR":"Math ERROR"}
 render()}
function press(k){
 var a=k.a;
 if(a==="shift"){S.shift=!S.shift;S.alpha=false;return render()}
 if(a==="alpha"){S.alpha=!S.alpha;S.shift=false;return render()}
 var ins=k.i;
 if(S.alpha&&k.al){var L=k.al[1];
  if(S.sto){S.vars[L]=S.ans;S.sto=false;toast(L+" = "+fmt(S.ans))}else insert(L);
  S.alpha=false;return render()}
 if(S.shift&&k.s)ins=k.s[1];
 S.shift=false;S.alpha=false;
 if(a==="sto"){S.sto=true;toast("STO: press ALPHA, then sin / cos / tan (X / Y / M)");return render()}
 if(a==="eq")return equals();
 if(a==="ac"){S.input="";S.err="";S.done=false;S.sto=false;return render()}
 if(a==="del"){if(S.done)S.done=false;S.input=S.input.replace(DELRE,"");S.err="";return render()}
 if(a==="fd"){S.math=!S.math;return render()}
 if(ins!=null){insert(ins);render()}}
function build(){
 var kb=$("keys");
 ROWS.forEach(function(row){row.forEach(function(k){
  var b=document.createElement("button");b.className="k "+(k.c||"");b.type="button";
  var sub="";
  if(k.s)sub+='<span class="s">'+k.s[0]+"</span>";
  if(k.al)sub+='<span class="al">'+k.al[0]+"</span>";
  if(k.sub)sub+='<span class="s">'+k.sub+"</span>";
  b.innerHTML=(sub?'<span class="sub">'+sub+"</span>":"")+k.m;
  var tm,lp=0;b.onpointerdown=function(){lp=0;tm=setTimeout(function(){if(CFG.hint&&(k.s||k.al)){lp=1;toast(k.m+" \u2192 "+(k.s?k.s[0]:k.al[0]))}},500)};b.onpointerup=b.onpointerleave=function(){clearTimeout(tm)};b.onclick=function(){if(!lp)press(k);lp=0};kb.appendChild(b)})});
 var nb=$("num");
 NUM.forEach(function(row){row.forEach(function(k){
  if(typeof k==="string")k={m:k,i:k};
  var b=document.createElement("button");b.className="k "+(k.c||"");b.type="button";b.textContent=k.m;
  b.onclick=function(){press(k)};nb.appendChild(b)})})}
function showHist(){
 var l=$("hlist");l.innerHTML="";
 if(!S.hist.length)l.innerHTML='<p class="empty">No calculations yet.</p>';
 S.hist.forEach(function(h){var d=document.createElement("div");d.className="hi";
  d.innerHTML="<small></small><b></b>";d.firstChild.textContent=h.e;d.lastChild.textContent="= "+fmt(h.r);

 var f=ys.filter(isFinite).sort(function(a,b){return a-b});if(!f.length)throw"Nothing to plot";var n=f.length,lo=f[Math.floor(.01*(n-1))],hi=f[Math.ceil(.99*(n-1))];if(hi-lo<1e-9){hi+=1;lo-=1}var pd2=(hi-lo)*.1;lo-=pd2;hi+=pd2;
 var X=function(x){return(x-x0)/(x1-x0)*W},Y=function(y){return H-(y-lo)/(hi-lo)*H};
 c.fillStyle="#fff";c.fillRect(0,0,W,H);c.strokeStyle="#bbb";c.lineWidth=1;c.fillStyle="#555";c.font="18px sans-serif";c.beginPath();
 if(lo<0&&hi>0){c.moveTo(0,Y(0));c.lineTo(W,Y(0))}if(x0<0&&x1>0){c.moveTo(X(0),0);c.lineTo(X(0),H)}c.stroke();
 c.fillText(R(x0),4,H-6);c.fillText(R(x1),W-70,H-6);c.fillText(R(hi),4,18);c.fillText(R(lo),4,H-26);
 c.strokeStyle=AC[CFG.acc];c.lineWidth=3;c.beginPath();var up=false,py=0;ys.forEach(function(y,i){if(!isFinite(y)){up=false;return}var yy=Y(y);if(!up||Math.abs(yy-py)>H*1.5){c.moveTo(i,yy);up=true}else c.lineTo(i,yy);py=yy});c.stroke()}
